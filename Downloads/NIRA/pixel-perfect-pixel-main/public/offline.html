<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIRA — Offline</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --bg: #071211;
      --card: #0F2422;
      --text: #EAF6F3;
      --muted: rgba(234, 246, 243, 0.65);
      --teal: #2DD4BF;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #F7F8F5;
      padding: 6px;
      box-sizing: border-box;
      margin: 0 auto 20px;
      display: block;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 10px;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      background: var(--teal);
      color: #041F1C;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 9999px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .helpline {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/nira-mark.png" alt="NIRA" class="logo">
    <h1>You are currently offline</h1>
    <p>Your calm space is safe. Check your internet connection and try reloading the page whenever you're ready.</p>
    <button class="btn" onclick="window.location.reload()">Try reconnecting</button>
    <div class="helpline">
      Emergency helplines work without internet:<br>
      <strong>112</strong> (National) · <strong>1091</strong> (Women)
    </div>
  </div>
</body>
</html>
